port = 8080
port = ${?CART_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?CART_SERVICE_METRICS_PORT}

service-name = "cart-service"
service-name = ${?CART_SERVICE_NAME}

redis {
  uri = "redis://localhost:6379"
  uri = ${?REDIS_URI}
  ttl-seconds = 86400
  ttl-seconds = ${?CART_TTL_SECONDS}
}

# example-client is not read by the live service (cart-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
